name: Sync reference sprite libraries

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/sync-reference-sprites.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout DBSL
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Download Legacy of Goku / Buu's Fury sprite sheets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import html
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          BASE = "https://www.spriters-resource.com"
          DEST = Path("assets/vendor/gba")
          GAMES = {
              "dbzlog": ("Dragon Ball Z - The Legacy of Goku", 49),
              "dbzlog2": ("Dragon Ball Z - The Legacy of Goku II", 101),
              "dbzbuusfury": ("Dragon Ball Z - Buu's Fury", 117),
          }
          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/126.0 Safari/537.36"
          )

          def request(url: str, referer: str | None = None) -> bytes:
              headers = {
                  "User-Agent": USER_AGENT,
                  "Accept": "text/html,application/xhtml+xml,image/avif,image/webp,image/png,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9",
              }
              if referer:
                  headers["Referer"] = referer
              last_error = None
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return response.read()
                  except Exception as exc:
                      last_error = exc
                      time.sleep(2 + attempt * 2)
              raise RuntimeError(f"Failed to fetch {url}: {last_error}")

          def clean_name(value: str) -> str:
              value = html.unescape(re.sub(r"<[^>]+>", "", value))
              value = re.sub(r"\s+", " ", value).strip()
              value = value.replace("/", "_").replace("\\", "_")
              value = re.sub(r"[\x00-\x1f]", "", value)
              return value or "asset"

          def game_assets(slug: str) -> dict[int, str]:
              urls = [
                  f"{BASE}/game_boy_advance/{slug}/",
                  f"{BASE}/game_boy_advance/{slug}/page-1/",
                  f"{BASE}/game_boy_advance/{slug}/page-2/",
              ]
              found: dict[int, str] = {}
              pattern = re.compile(
                  rf'href=["\']/game_boy_advance/{re.escape(slug)}/asset/(\d+)/(?:page-\d+/)?["\'][^>]*>(.*?)</a>',
                  re.I | re.S,
              )
              fallback = re.compile(
                  rf'/game_boy_advance/{re.escape(slug)}/asset/(\d+)/',
                  re.I,
              )
              for url in urls:
                  try:
                      page = request(url).decode("utf-8", "replace")
                  except Exception:
                      continue
                  for match in pattern.finditer(page):
                      found[int(match.group(1))] = clean_name(match.group(2))
                  for match in fallback.finditer(page):
                      found.setdefault(int(match.group(1)), f"asset-{match.group(1)}")
              return found

          def download_asset(slug: str, asset_id: int) -> bytes:
              asset_page = f"{BASE}/game_boy_advance/{slug}/asset/{asset_id}/"
              direct = f"{BASE}/download/{asset_id}/"
              data = request(direct, referer=asset_page)
              if data.startswith(b"\x89PNG\r\n\x1a\n"):
                  return data

              # Some site configurations return an HTML redirect page instead
              # of the PNG from /download/. Resolve a sheet URL from the asset
              # page as a fallback.
              page = request(asset_page).decode("utf-8", "replace")
              candidates = re.findall(
                  r'(?:https?:)?//[^"\']+\.png(?:\?[^"\']*)?|/resources/[^"\']+\.png(?:\?[^"\']*)?',
                  page,
                  re.I,
              )
              for candidate in candidates:
                  if candidate.startswith("//"):
                      candidate = "https:" + candidate
                  elif candidate.startswith("/"):
                      candidate = BASE + candidate
                  image = request(candidate, referer=asset_page)
                  if image.startswith(b"\x89PNG\r\n\x1a\n"):
                      return image
              raise RuntimeError(
                  f"Asset {slug}/{asset_id} did not resolve to a PNG"
              )

          if DEST.exists():
              import shutil
              shutil.rmtree(DEST)
          DEST.mkdir(parents=True, exist_ok=True)

          catalog = ["game\tasset_id\tname\trelative_path"]
          total = 0
          for slug, (game_name, expected) in GAMES.items():
              assets = game_assets(slug)
              print(f"{slug}: discovered {len(assets)} assets (expected {expected})")
              if len(assets) < expected:
                  raise RuntimeError(
                      f"Only discovered {len(assets)} of {expected} assets for {slug}"
                  )

              game_dir = DEST / slug
              game_dir.mkdir(parents=True, exist_ok=True)
              for index, (asset_id, name) in enumerate(sorted(assets.items()), start=1):
                  safe_name = clean_name(name)
                  filename = f"{asset_id}__{safe_name}.png"
                  target = game_dir / filename
                  target.write_bytes(download_asset(slug, asset_id))
                  catalog.append(
                      f"{game_name}\t{asset_id}\t{safe_name}\t{slug}/{filename}"
                  )
                  total += 1
                  if index % 20 == 0 or index == len(assets):
                      print(f"  {index}/{len(assets)} downloaded")
                  time.sleep(0.15)

          (DEST / "CATALOG.tsv").write_text(
              "\n".join(catalog) + "\n",
              encoding="utf-8",
          )
          (DEST / "README.md").write_text(
              """# Dragon Ball GBA reference sprite library

This directory mirrors reference sprite sheets for:

- Dragon Ball Z: The Legacy of Goku
- Dragon Ball Z: The Legacy of Goku II
- Dragon Ball Z: Buu's Fury

Source pages: The Spriters Resource. The numeric prefix in each filename is
that site's asset ID. `CATALOG.tsv` maps IDs, names, games, and paths.

These assets are stored as source/reference material for the DBSL prototype.
Copyright and redistribution rights remain with their respective owners.
""",
              encoding="utf-8",
          )
          print(f"Downloaded {total} official PNG sprite sheets")
          PY

      - name: Mirror HeroesUnited2Dev visual assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/hu2-dev
          git clone --depth 1 --branch master --filter=blob:none --sparse \
            https://github.com/DarkerLegends/HeroesUnited2Dev.git /tmp/hu2-dev
          git -C /tmp/hu2-dev sparse-checkout set Icons

          rm -rf assets/vendor/hu2-dev/Icons
          mkdir -p assets/vendor/hu2-dev/Icons

          cd /tmp/hu2-dev/Icons
          find . -type f \( -iname '*.dmi' -o -iname '*.png' \) -print0 | \
            while IFS= read -r -d '' file; do
              mkdir -p "$GITHUB_WORKSPACE/assets/vendor/hu2-dev/Icons/$(dirname "$file")"
              cp "$file" "$GITHUB_WORKSPACE/assets/vendor/hu2-dev/Icons/$file"
            done
          cd "$GITHUB_WORKSPACE"

          SOURCE_SHA="$(git -C /tmp/hu2-dev rev-parse HEAD)"
          DMI_COUNT="$(find assets/vendor/hu2-dev/Icons -type f -name '*.dmi' | wc -l | tr -d ' ')"
          PNG_COUNT="$(find assets/vendor/hu2-dev/Icons -type f -name '*.png' | wc -l | tr -d ' ')"

          cat > assets/vendor/hu2-dev/README.md <<EOF
          # HeroesUnited2Dev visual asset mirror

          Source: https://github.com/DarkerLegends/HeroesUnited2Dev
          Source commit: ${SOURCE_SHA}

          Visual assets only (`.dmi` and `.png`) from `Icons/` are mirrored here.
          Gameplay/code files are intentionally excluded.

          - DMI: ${DMI_COUNT}
          - PNG: ${PNG_COUNT}
          EOF
          sed -i 's/^          //' assets/vendor/hu2-dev/README.md

      - name: Commit synchronized libraries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DBSL Sprite Sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/vendor/gba assets/vendor/hu2-dev
          if git diff --cached --quiet; then
            echo "Reference sprite libraries already synchronized."
            exit 0
          fi
          git commit -m "assets: import complete GBA and HU2Dev sprite libraries"
          git push origin HEAD:develop
